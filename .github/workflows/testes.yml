name: testes

on:
  push:
  pull_request:

jobs:
  pytest:
    name: Python ${{ matrix.python-version }} ${{ matrix.numpy }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        numpy: [""]
        include:
          # versão mínima declarada em pyproject.toml (numpy>=1.24)
          - python-version: "3.11"
            numpy: "numpy==1.24.*"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar o AURORA e o pytest
        run: python -m pip install -e ".[dev]" ${{ matrix.numpy }}
      - name: Executar os testes
        run: python -m pytest -q
