name: testes

on:
  push:
  pull_request:

jobs:
  pytest:
    name: Python ${{ matrix.python-version }} [${{ matrix.extras }}] ${{ matrix.pins }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        extras: ["dev,graficos"]
        pins: [""]
        include:
          # versões mínimas declaradas em pyproject.toml
          - python-version: "3.11"
            extras: "dev,graficos"
            pins: "numpy==1.24.* scipy==1.10.* matplotlib==3.6.* plotly==5.0.*"
          # sem as bibliotecas de gráficos (extra opcional): o núcleo deve funcionar sozinho
          - python-version: "3.12"
            extras: "dev"
            pins: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar o AURORA e as dependências de teste
        run: python -m pip install -e ".[${{ matrix.extras }}]" ${{ matrix.pins }}
      - name: Executar os testes
        run: python -m pytest -q
