[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-simulador"
version = "0.1.0"
description = "AURORA — plataforma educacional de simulação de mecânica orbital, radar e exploração espacial (etapa 1: fundamentos matemáticos)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
aurora = "aurora.interface.cli:main"

[tool.setuptools.packages.find]
include = ["aurora*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
